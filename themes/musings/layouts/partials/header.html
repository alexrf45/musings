<header class="site-header">
  <div class="site-wrap">
    <nav class="site-nav">
      <a class="site-brand" href="{{ "/" | relURL }}">
        <img src="/images/thoth1-navbar.png" width="20" height="20" alt="">
        phr3d
      </a>
      <div class="site-links">
        <a class="site-link" href="{{ "/posts/" | relURL }}">poems</a>
        <a class="site-link" href="{{ "/notes/" | relURL }}">notes</a>
        <a class="site-link" href="{{ site.Params.spotifyURL }}" target="_blank" rel="noopener">music</a>
        <a class="site-link" href="{{ site.Params.githubURL }}" target="_blank" rel="noopener">github</a>
        <div x-data="{ dark: document.documentElement.getAttribute('data-bs-theme') !== 'light' }"
             x-init="$watch('dark', v => {
               const t = v ? 'dark' : 'light';
               document.documentElement.setAttribute('data-bs-theme', t);
               localStorage.setItem('theme', t);
             })">
          <button class="site-link" @click="dark = !dark"
                  :title="dark ? 'Switch to light mode' : 'Switch to dark mode'">
            <i class="bi" :class="dark ? 'bi-sun' : 'bi-moon-stars-fill'"></i>
          </button>
        </div>
      </div>
    </nav>
  </div>
</header>
