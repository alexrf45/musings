<article class="feed-item">
  <div class="feed-item-row">
    <h2 class="feed-item-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <span class="feed-item-sep"></span>
    <time class="feed-item-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format "Jan 2, 2006" }}</time>
  </div>
</article>
